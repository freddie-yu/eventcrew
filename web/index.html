<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EventCrew — Flutter + Supabase staffing demo.">
  <title>EventCrew</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Deployment heartbeat: refresh public EventCrew demo -->
  <script>
    window.eventCrewEnablePush = async function () {
      if (!('serviceWorker' in navigator) || !('Notification' in window)) {
        return null;
      }

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        return null;
      }

      const [appSdk, messagingSdk] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js'),
      ]);

      const firebaseConfig = {
        apiKey: 'AIzaSyD4RXH9Y_NZ84Uyk8S9pG3f0MAfqw43-58',
        authDomain: 'eventcrew-demo.firebaseapp.com',
        projectId: 'eventcrew-demo',
        storageBucket: 'eventcrew-demo.firebasestorage.app',
        messagingSenderId: '1015453781744',
        appId: '1:1015453781744:web:5dc0778cc6f055f9b47c35',
      };

      let app = appSdk.getApps().find((candidate) => candidate.name === 'eventcrewPush');
      if (!app) {
        app = appSdk.initializeApp(firebaseConfig, 'eventcrewPush');
      }

      const base = new URL(document.baseURI);
      const workerUrl = new URL('firebase-messaging-sw.js', base).href;
      const scopeUrl = new URL('firebase-cloud-messaging-push-scope/', base).pathname;
      const registration = await navigator.serviceWorker.register(workerUrl, {
        scope: scopeUrl,
      });

      if (!registration.active) {
        await new Promise((resolve, reject) => {
          const worker = registration.installing || registration.waiting;
          if (!worker || worker.state === 'activated') {
            resolve();
            return;
          }

          const timeout = setTimeout(
            () => reject(new Error('FCM service worker activation timed out')),
            10000,
          );

          worker.addEventListener('statechange', () => {
            if (worker.state === 'activated') {
              clearTimeout(timeout);
              resolve();
            }
          });
        });
      }

      const messaging = messagingSdk.getMessaging(app);
      return messagingSdk.getToken(messaging, {
        vapidKey: 'BBxjShomDqz-A37ul5EBCRCmrktpO80ohftoSeA3DVpsgk9R06f0UvMZJTbFGANDkkkz58PVMN1QloGMLF4MWCY',
        serviceWorkerRegistration: registration,
      });
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Public demo restore 2026-09-30 -->
</body>
</html>
