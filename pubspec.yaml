name: eventcrew
description: >
  EventCrew — Flutter + Supabase staffing demo. Event signup, secure
  attendance tracking, realtime event chat, waitlists, and push-ready alerts.
publish_to: 'none'
version: 0.3.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.6.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
