name: Generate EventCrew Synced Voiceover

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/generate-synced-voiceover.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Download Piper and female voice
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 3 -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz
          curl -L --retry 3 -o voice.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/hfc_female/medium/en_US-hfc_female-medium.onnx
          curl -L --retry 3 -o voice.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/hfc_female/medium/en_US-hfc_female-medium.onnx.json

      - name: Generate scene-matched narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voiceover
          speak () {
            local name="$1"
            local text="$2"
            printf '%s\n' "$text" | ./piper/piper --model voice.onnx --config voice.onnx.json --output_file "voiceover/$name.wav"
          }

          speak 01_intro "EventCrew is a Flutter and Supabase staffing app built for real event operations."
          speak 02_fred_join "Fred starts with an open Riverside shift and joins it. The app immediately confirms his place, with capacity enforced on the server."
          speak 03_sarah_waitlist "Sarah opens the same shift after it reaches capacity. Instead of overbooking, EventCrew places her on the waitlist."
          speak 04_promotion "Now Fred leaves the shift. After Sarah refreshes, she is automatically promoted from waitlisted to confirmed. The handoff is handled atomically in PostgreSQL."
          speak 05_attendance "Sarah clocks in, returns to the shift list, then opens the shift again. Her active clock-in is still there because attendance state comes from the server, not local UI state."
          speak 06_chat_setup "For the Downtown Marathon, both Sarah and Fred are confirmed on the same shift, so they share the same event-scoped team chat."
          speak 07_chat_realtime "Sarah sends a water-restock update. Without any refresh on Fred's side, the message appears in his chat in real time."
          speak 08_push "Operational alerts use Firebase Cloud Messaging, while service credentials remain on the backend behind Supabase Edge Functions."
          speak 09_engineering "The repository is backed by automated Flutter analysis, tests, web builds, database migrations, and documented architecture, so changes are checked before deployment."
          speak 10_outro "EventCrew shows how Flutter and Supabase can extend a staffing product safely, incrementally, and reliably."

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: eventcrew-synced-female-voiceover
          path: voiceover/*.wav
          if-no-files-found: error
          retention-days: 1
