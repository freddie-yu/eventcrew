name: Deploy Web Demo

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy-web-demo.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eventcrew-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build recruiter demo
        run: |
          flutter build web --release \
            --base-href /eventcrew/ \
            --dart-define=SUPABASE_URL=https://ryqwctcihrcbqllexuut.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_3kcy42eEHm3_HrCUSV37hg_VnruwvT6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
